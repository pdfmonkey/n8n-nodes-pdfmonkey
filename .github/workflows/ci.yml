name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 / ${{ matrix.package-manager }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check npm lockfile manifest metadata
        if: matrix.package-manager == 'npm'
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const manifest = require('./package.json');
          const lock = require('./package-lock.json');
          for (const field of ['name', 'version', 'engines', 'dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies', 'peerDependenciesMeta']) {
            assert.deepEqual(lock.packages[''][field], manifest[field], `package-lock.json differs on ${field}`);
          }
          NODE

      - name: Install npm dependencies from lockfile
        if: matrix.package-manager == 'npm'
        # Keep lifecycle scripts enabled to exercise native dependencies.
        run: npm ci

      - name: Install the declared pnpm version
        if: matrix.package-manager == 'pnpm'
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install pnpm dependencies from lockfile
        if: matrix.package-manager == 'pnpm'
        # Retain pnpm's default dependency build-script policy.
        run: pnpm install --frozen-lockfile

      - name: Verify manifests and lockfiles remain unchanged
        run: git diff --exit-code -- package.json package-lock.json pnpm-lock.yaml

      - name: Build
        run: ${{ matrix.package-manager }} run build

      - name: Lint
        run: ${{ matrix.package-manager }} run lint

      - name: Smoke-test compiled nodes and credentials
        run: node --test .github/scripts/smoke.cjs

      - name: Audit all dependencies (including development tooling)
        run: ${{ matrix.package-manager }} audit --audit-level=low
